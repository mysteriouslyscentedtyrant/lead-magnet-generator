<!--
  Lead Magnet Generator - environment probe (temporary, safe to delete after the test)
  Paste into a systeme.io Raw HTML element, publish the page, open the LIVE page.
  It checks what the real page allows and shows a "Copy results" button.
  It never calls the AI (the n8n test sends an invalid request on purpose).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .lm-probe, .lm-probe * { box-sizing: border-box; font-family: 'Outfit', sans-serif; }
  .lm-probe { max-width: 720px; margin: 40px auto; padding: 28px; border: 1px solid #E3E5EC; border-radius: 16px; background: #FFFFFF; color: #181C39; }
  .lm-probe h3 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
  .lm-probe p { margin: 0 0 18px; color: #5e6075; font-size: 15px; }
  .lm-probe ul { list-style: none; margin: 0 0 20px; padding: 0; }
  .lm-probe li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #F0F1F5; font-size: 15px; }
  .lm-probe .lm-s { width: 64px; flex: none; font-weight: 600; }
  .lm-probe .ok { color: #1E8E3E; } .lm-probe .no { color: #C5221F; } .lm-probe .info { color: #5e6075; }
  .lm-probe button { font: inherit; font-weight: 500; padding: 12px 20px; border: 0; border-radius: 10px; background: #181C39; color: #FFFFFF; cursor: pointer; }
</style>

<div class="lm-probe" id="lm-probe">
  <h3>Lead Magnet Generator: page check</h3>
  <p>Running checks... wait about 5 seconds, then click "Copy results" and paste them to Claude.</p>
  <ul id="lm-probe-list"><li><span class="lm-s info">...</span><span>Inline script did not run yet (if this never changes, scripts are blocked).</span></li></ul>
  <button type="button" id="lm-probe-copy">Copy results</button>
</div>

<script>
(function () {
  var N8N = 'https://n8n.team-sio.com/webhook/lead-magnet/outline';
  var EXT = 'https://cdn.jsdelivr.net/gh/mysteriouslyscentedtyrant/lead-magnet-generator@main/frontend/probe.js';
  var list = document.getElementById('lm-probe-list');
  var results = [];

  function add(status, label, detail) {
    results.push('[' + status + '] ' + label + (detail ? ': ' + detail : ''));
    var li = document.createElement('li');
    var s = document.createElement('span');
    s.className = 'lm-s ' + (status === 'OK' ? 'ok' : status === 'NO' ? 'no' : 'info');
    s.textContent = status;
    var t = document.createElement('span');
    t.textContent = label + (detail ? ': ' + detail : '');
    li.appendChild(s); li.appendChild(t); list.appendChild(li);
  }
  list.innerHTML = '';

  add('OK', 'Inline <script> runs');
  add('INFO', 'Page address', location.origin + location.pathname);

  var inFrame = false;
  try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  add(inFrame ? 'NO' : 'OK', 'Runs directly in the page (not inside an iframe)', inFrame ? 'inside an iframe' : 'yes');

  add(typeof window.print === 'function' ? 'OK' : 'NO', 'Print (PDF export) available');

  try { localStorage.setItem('lm_probe', '1'); localStorage.removeItem('lm_probe'); add('OK', 'Browser storage works'); }
  catch (e) { add('NO', 'Browser storage works', 'blocked'); }

  var box = document.getElementById('lm-probe');
  add('INFO', 'Available width for the tool', box.parentElement ? Math.round(box.parentElement.getBoundingClientRect().width) + 'px' : 'unknown');

  var tag = document.createElement('script');
  tag.src = EXT + '?t=' + Date.now();
  tag.onload = function () { add(window.__lmProbeExternal === 'loaded' ? 'OK' : 'NO', 'Script from GitHub (jsDelivr) loads and runs'); };
  tag.onerror = function () { add('NO', 'Script from GitHub (jsDelivr) loads and runs', 'blocked or failed'); };
  document.head.appendChild(tag);

  setTimeout(function () {
    var fontOk = document.fonts && document.fonts.check ? document.fonts.check('16px Outfit') : false;
    add(fontOk ? 'OK' : 'NO', 'Google Font "Outfit" loaded');
  }, 2500);

  // Sends an INVALID request on purpose: n8n answers 400 without calling the AI.
  fetch(N8N, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ format: 'probe' }) })
    .then(function (r) { return r.json().then(function (j) { return { status: r.status, j: j }; }); })
    .then(function (x) {
      var ok = x.status === 400 && x.j && x.j.code === 'invalid_input';
      add(ok ? 'OK' : 'NO', 'n8n webhook reachable from this page (CORS)', 'HTTP ' + x.status);
    })
    .catch(function (e) { add('NO', 'n8n webhook reachable from this page (CORS)', String(e && e.message || e)); });

  document.getElementById('lm-probe-copy').addEventListener('click', function () {
    var text = 'Lead Magnet probe results\n' + results.join('\n') + '\nBrowser: ' + navigator.userAgent;
    var btn = this;
    function done() { btn.textContent = 'Copied!'; setTimeout(function () { btn.textContent = 'Copy results'; }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { window.prompt('Copy these results:', text); });
    } else { window.prompt('Copy these results:', text); }
  });
})();
</script>
